# PMV Game - Default Configuration
# Matches paper Section 6 and Algorithm 1

model:
  prover_model: "Qwen/Qwen2-0.5B"
  verifier_model: "Qwen/Qwen2-0.5B"
  num_verifiers: 3
  use_quantization: true
  prover_lora_r: 8
  prover_lora_alpha: 16
  verifier_lora_r: 8
  verifier_lora_alpha: 16
  aggregator_hidden_dim: 64

training:
  rounds: 10
  mu_0: 0.5                    # Prior P(τ=H), fixed at 1/2 during training (Section 5)
  bootstrap_episodes: 50
  bootstrap_oracle_episodes: 50 # Add guaranteed-correct helpful examples to avoid label collapse early
  collect_episodes: 50
  max_buffer_size: 5000        # Replay buffer capacity (Section 6.4)
  save_checkpoints: true
  checkpoint_every: 1
  checkpoint_root: "results/checkpoints"

  # Phase 1: Nash update (Algorithm 3)
  oversight_rule: "supervised"  # Options: supervised, pe_min, pe_margin, softmin, average, median, min, max
  verifier_lr: 1.0e-4
  verifier_epochs: 3
  verifier_batch_size: 4
  verifier_max_length: 512
  phase1_micro_step: true
  phase1_balance_labels: true
  phase1_stratified_batches: true
  verifier_dropout: 0.0        # Dropout p for SoftMin mask (Appendix D)
  softmin_beta: 5.0            # Temperature β for SoftMin utility

  # Phase 2: Stackelberg PPO (Algorithm 2)
  prover_lr: 1.0e-5
  helpful_warmup_steps: 60
  helpful_warmup_batch_size: 4
  helpful_warmup_lr: 2.0e-5
  helpful_warmup_max_length: 1024
  ppo_epochs: 4
  clip_ratio: 0.2
  kl_coeff: 0.1
  use_reference_model: false
  helpful_do_sample: false
  helpful_temperature: 0.2
  helpful_max_new_tokens: 768
  sneaky_do_sample: true
  sneaky_temperature: 0.9
  sneaky_max_new_tokens: 768
  ppo_max_length: 1024

  # Reward function (Equation 4)
  alpha_1: 1.0
  beta_1: 1.0
  alpha_2: -0.5
  beta_2: 0.25
  sneaky_fool_threshold: 0.5
