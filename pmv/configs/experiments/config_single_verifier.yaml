# Single-verifier baseline: minimal Kirchner-style reset
model:
  prover_model: "Qwen/Qwen2.5-3B-Instruct"
  verifier_model: "Qwen/Qwen2.5-3B-Instruct"
  num_verifiers: 1
  use_quantization: true
  prover_lora_r: 8
  prover_lora_alpha: 16
  verifier_lora_r: 8
  verifier_lora_alpha: 16
  aggregator_hidden_dim: 64

training:
  rounds: 10
  mu_0: 0.5
  bootstrap_episodes: 50
  bootstrap_oracle_episodes: 50
  collect_episodes: 50
  max_buffer_size: 5000
  oversight_rule: "supervised"

  verifier_lr: 1.0e-4
  verifier_epochs: 3
  verifier_batch_size: 4
  verifier_max_length: 512
  phase1_micro_step: true
  phase1_balance_labels: true
  phase1_stratified_batches: true
  verifier_dropout: 0.0
  softmin_beta: 5.0

  prover_lr: 1.0e-5
  helpful_warmup_steps: 60
  helpful_warmup_batch_size: 4
  helpful_warmup_lr: 2.0e-5
  helpful_warmup_max_length: 1024
  ppo_epochs: 4
  clip_ratio: 0.2
  kl_coeff: 0.1
  use_reference_model: false
  helpful_do_sample: false
  helpful_temperature: 0.2
  helpful_max_new_tokens: 768
  sneaky_do_sample: true
  sneaky_temperature: 0.9
  sneaky_max_new_tokens: 768
  ppo_max_length: 1024

  alpha_1: 1.0
  beta_1: 1.0
  alpha_2: -0.5
  beta_2: 0.25
  sneaky_fool_threshold: 0.5
