# Tuned math stabilization config for PMV multismall.
# Primary goal: recover non-collapsed helpful correctness before rule comparisons.

model:
  prover_model: "Qwen/Qwen2.5-3B-Instruct"
  verifier_model: "Qwen/Qwen2.5-3B-Instruct"
  num_verifiers: 1
  use_quantization: true
  prover_lora_r: 8
  prover_lora_alpha: 16
  verifier_lora_r: 8
  verifier_lora_alpha: 16
  aggregator_hidden_dim: 64

dataset:
  type: math
  num_samples: 50000

training:
  oversight_rule: "supervised"
  seed: 0
  # Helpful-first stabilization: prioritize helpful signal early.
  mu_0: 0.75

  rounds: 5
  bootstrap_episodes: 80
  bootstrap_oracle_episodes: 80
  collect_episodes: 100
  max_buffer_size: 8000
  helpful_warmup_steps: 120
  # Keep warmup in bootstrap (Round 0); disable repeated round warmups.
  round_helpful_warmup_steps: 0

  verifier_lr: 1.0e-4
  verifier_epochs: 3
  verifier_batch_size: 8
  verifier_max_length: 768
  auto_adjust_verifier_max_length: true
  verifier_prompt_margin: 256
  verifier_dropout: 0.0
  softmin_beta: 5.0
  single_verifier_role: "computational_accuracy"
  # Bradley-Terry pairwise verifier loss (replaces pointwise BCE).
  # bt_temperature: margin multiplier τ in -log σ(τ·(f+ - f-)).
  # bt_centering_lambda: Kirchner L2 regularizer weight λ to prevent score saturation.
  # bt_accumulate_steps: gradient accumulation over N pairs before optimizer.step().
  # bt_max_pairs_per_problem: cap cross-product pairs per problem (prevents quadratic blowup).
  bt_temperature: 4.0
  bt_centering_lambda: 0.01
  bt_accumulate_steps: 8
  bt_max_pairs_per_problem: 4

  prover_lr: 1.0e-5
  ppo_epochs: 4
  ppo_batch_size: 8
  # Optional fixed PPO optimizer budget per round; set >0 (e.g., 8000) to
  # override epoch-based updates.
  ppo_target_updates_per_round: 0
  ppo_log_every: 200
  ppo_resume_checkpoint_interval: 100
  ppo_early_stop_enable: true
  ppo_early_stop_patience_windows: 4
  ppo_early_stop_min_delta: 5.0e-4
  ppo_early_stop_warmup_updates: 1000
  ppo_max_wall_time_seconds: 0
  prover_distributed_ppo: false
  prover_distributed_world_size: 2
  clip_ratio: 0.1
  kl_coeff: 0.1
  use_reference_model: true
  # If two GPUs are available, place reference prover on a different GPU
  # and precompute ref logprobs in parallel.
  split_reference_gpu: true
  ppo_parallel_reference_eval: true

  helpful_do_sample: false
  helpful_temperature: 0.2
  helpful_max_new_tokens: 512
  sneaky_do_sample: true
  sneaky_temperature: 0.9
  collect_early_stop_enable: true
  collect_early_check_every: 20
  collect_early_min_episodes: 80
  collect_early_stop_epsilon: 0.05
  collect_paired_roles: true
  sneaky_retries_for_incorrect: 2
  sneaky_select_hard_negative: true
  sneaky_max_new_tokens: 512
  helpful_warmup_max_length: 1024
  ppo_max_length: 1024

  # Canonical role-alignment reward from the architecture.
  reward_mode: "affine"
  alpha_1: 2.0
  beta_1: 1.0
  alpha_2: -2.0
  beta_2: -1.0
  sneaky_fool_threshold: 0.5
  supervised_single_identity: true
  # Multi-GPU verifier acceleration knobs.
  multi_gpu_verifier_parallel: true
  parallel_verifier_inference: true
  resume_from_checkpoint: true

  oversight_decision_threshold: 0.5
  verifier_decision_threshold: 0.5
