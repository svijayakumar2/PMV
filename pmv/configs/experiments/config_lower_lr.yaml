logging:
  logdir: runs/pmv_stackelberg/lower_lr
model:
  num_verifiers: 3
  prover_name: meta-llama/Llama-2-7b-chat-hf
  verifier_name: meta-llama/Llama-2-1b-hf
training:
  aggregator_epochs: 10
  aggregator_lr: 5.0e-05
  clip_ratio: 0.2
  helpful_prior: 0.5
  kl_coeff: 0.01
  lora_alpha: 32
  lora_dropout: 0.1
  lora_r: 8
  lora_target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  max_episodes: 100
  max_replay_size: 200
  ppo_epochs: 4
  pretrain_examples: 100
  prover_lr: 5.0e-06
  rounds: 10
  save_every: 5
  use_lora: true
  verifier_epochs: 3
  verifier_lr: 5.0e-06
  verifier_pretrain_examples: 500
